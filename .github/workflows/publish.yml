name: publish image

# Reusable build-and-publish workflow. Service repos call this with `uses:` and
# pass their own image name, platform and gate command, so the build stays next
# to the code while the pipeline itself lives in exactly one place.
#
#   jobs:
#     publish:
#       permissions:          # REQUIRED here — see note below
#         contents: read
#         packages: write
#       uses: geekyed/homelab-deploy/.github/workflows/publish.yml
#       with:
#         image: ghcr.io/geekyed/agile-ed
#         setup: bun install --frozen-lockfile
#         validate: bun run check
#
# A called workflow can only ever NARROW the permissions its caller grants, it
# cannot widen them. So the `permissions:` block above has to be in the calling
# job as well, or the push to the registry fails with 403 even though this
# workflow asks for write.
#
# SECURITY: `setup` and `validate` are interpolated straight into `run`, which
# is script injection if the input is ever attacker-controlled. Only call this
# from repositories you control, and only with literal strings.

on:
  workflow_call:
    inputs:
      image:
        description: 'Full image reference without a tag, e.g. ghcr.io/geekyed/agile-ed'
        required: true
        type: string
      platform:
        description: 'Target platform(s). Default suits an Apple Silicon mac mini.'
        required: false
        default: 'linux/arm64'
        type: string
      context:
        description: 'Build context, relative to the service repo root'
        required: false
        default: '.'
        type: string
      dockerfile:
        description: 'Dockerfile path, relative to the context'
        required: false
        default: 'Dockerfile'
        type: string
      setup:
        description: 'Dependency install command, run before validate. Skipped if empty.'
        required: false
        default: ''
        type: string
      validate:
        description: 'Gate command. If empty, no toolchain is set up and the image builds unvalidated.'
        required: false
        default: ''
        type: string
      bun_version:
        description: 'Bun used for setup/validate. Keep in step with the service Dockerfile.'
        required: false
        default: '1.4.0'
        type: string

# A push to main followed quickly by another should not queue two identical
# builds; the newer commit wins.
concurrency:
  group: publish-${{ inputs.image }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The toolchain exists only to run the gate, so a service with no
      # `validate` gets no Bun and no install step at all.
      - name: set up bun
        if: ${{ inputs.validate != '' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: install dependencies
        if: ${{ inputs.validate != '' && inputs.setup != '' }}
        run: ${{ inputs.setup }}

      - name: validate
        if: ${{ inputs.validate != '' }}
        run: ${{ inputs.validate }}

      - name: set up qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platform }}
          push: true
          # `main` is the tag the mac mini follows. The sha tag is what you pin
          # to when rolling back, so it is worth having on every build.
          tags: |
            ${{ inputs.image }}:main
            ${{ inputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
