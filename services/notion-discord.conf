# Deployment policy for notion-discord on the mac mini.
#
# Topology and the image reference live in compose.yml beside this file. This
# file is only policy: where things are, and how patient we are.

PROJECT=notion-discord

# The manual deployment used the service names `app` and `redis`. Keeping them
# lets the first homelab deploy adopt the existing Redis container and volume
# instead of creating a second Redis and losing the verification tokens.
COMPOSE_SERVICE=app
COMPOSE_FILE=services/notion-discord/compose.yml
ENV_FILE=.secrets/notion-discord.env

# The image's healthcheck allows a 10s start period plus three 15s intervals,
# and Redis may need its own first healthcheck. 120s covers both before the
# deploy is treated as failed and rolled back.
HEALTH_TIMEOUT=120

# launchd StartInterval in seconds. 300 puts a merge to main on the machine
# within five minutes.
INTERVAL=300
