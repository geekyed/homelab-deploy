# Deployment policy for the CV on the mac mini.
#
# Topology and the image reference live in compose.yml beside this file. This
# file is only policy: where things are, and how patient we are.

PROJECT=edward-weston-cv

COMPOSE_SERVICE=edward-weston-cv
COMPOSE_FILE=services/edward-weston-cv/compose.yml
ENV_FILE=.secrets/edward-weston-cv.env

# The image's healthcheck allows a 5s start period plus three 30s retries, so
# 90s covers a full round of retries before the deploy is rolled back.
HEALTH_TIMEOUT=90

# launchd StartInterval in seconds. 300 puts a merge to main on the machine
# within five minutes.
INTERVAL=300
