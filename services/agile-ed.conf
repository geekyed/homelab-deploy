# Deployment policy for agile-ed on the mac mini.
#
# Topology and the image reference live in compose.yml beside this file, because
# those are the service's own contract and they belong next to each other. This
# file is only policy: where things are, and how patient we are.

# Compose project name. It is set explicitly rather than inferred from the
# directory, and it is what keeps this service on its own Docker network — a
# sibling service sharing that network could reach the app directly and forge
# the cf-connecting-ip header that the login rate limiter trusts.
PROJECT=agile-ed

COMPOSE_SERVICE=agile-ed
COMPOSE_FILE=services/agile-ed/compose.yml
ENV_FILE=.secrets/agile-ed.env

# How long `up --wait` gives a new container to pass its healthcheck before the
# deploy is treated as failed and rolled back. The app's healthcheck allows
# 5s start period plus three 30s retries, so 90s is a little under two full
# rounds and still bounded.
HEALTH_TIMEOUT=90

# launchd StartInterval in seconds. 300 puts a merge to main on the machine
# within five minutes.
INTERVAL=300
